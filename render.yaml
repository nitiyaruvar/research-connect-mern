services:
  - type: web
    name: research-connect-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/ready
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: MAX_UPLOAD_BYTES
        value: 5242880
      - key: UPLOAD_DIR
        value: /var/data/uploads
    disk:
      name: research-connect-uploads
      mountPath: /var/data
      sizeGB: 1
